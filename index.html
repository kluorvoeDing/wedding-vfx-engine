<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #vj-console {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;
            color: #fff;
            font-family: monospace;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-sizing: border-box;
            z-index: 100;
            border: 1px solid #333;
            transition: transform 0.3s ease;
        }
        #vj-console.collapsed {
            transform: translateY(calc(100% - 30px));
        }
        #console-toggle {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        #webcam-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            z-index: 10;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; /* hidden by default, can be toggled */
        }
        #webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .hud-text {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0.7;
        }
        #file-protocol-warning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            color: #fff;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        #file-protocol-warning .message {
            max-width: 560px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 8px;
            padding: 24px;
            background: rgba(20, 20, 20, 0.95);
            line-height: 1.7;
        }
        #file-protocol-warning a {
            color: #9fd0ff;
            font-weight: 700;
        }
        html.file-protocol #file-protocol-warning {
            display: flex;
        }
    </style>
    <script>
        if (window.location.protocol === 'file:') {
            document.documentElement.classList.add('file-protocol');
        }
    </script>
    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
</head>
<body>
    <div id="file-protocol-warning">
        <div class="message">
            <h1>請使用本機 HTTP 預覽</h1>
            <p>這個專案使用 ES modules、GLTF 與跨來源資源，直接開啟 <code>index.html</code> 會被瀏覽器 CORS 擋住。</p>
            <p>請先啟動本機伺服器，然後開啟 <a href="http://127.0.0.1:5500/?v=20260616c">http://127.0.0.1:5500/?v=20260616c</a></p>
        </div>
    </div>
    <div id="canvas-container"></div>
    
    <div class="hud-text">
        <div>GPGPU PARTICLE SYSTEM</div>
        <div id="fps-counter">FPS: 0</div>
        <div id="particle-count">PARTICLES: 0</div>
    </div>

    <div id="webcam-container">
        <video id="webcam-video" autoplay playsinline></video>
    </div>

    <div id="vj-console">
        <button id="console-toggle">▼ 隱藏面板</button>
        <div class="control-group" style="margin-top: 15px;">
            <label for="uProgress">流體散開程度 (可透過視訊捏合控制)</label>
            <input type="range" id="uProgress" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="control-group">
            <label for="cameraMode">運鏡模式</label>
            <select id="cameraMode" style="width: 100%; padding: 5px; background: #222; color: white; border: 1px solid #444;">
                <option value="auto">自動電影運鏡</option>
                <option value="manual">手動控制 (滑鼠拖曳)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="uploadPhoto">上傳照片 (JPG/PNG)</label>
            <input type="file" id="uploadPhoto" accept="image/*" style="width: 100%; color: white;">
        </div>
        <div class="control-group">
            <label for="uploadLogo">上傳 LOGO / 形變目標 (PNG)</label>
            <input type="file" id="uploadLogo" accept="image/*" style="width: 100%; color: white;">
        </div>
        <div class="control-group">
            <label for="particleDensity">粒子密度 (1=最高畫質, 5=最順暢)</label>
            <input type="range" id="particleDensity" min="1" max="5" step="1" value="1">
        </div>
        <div class="control-group">
            <label for="logoScale">整體顯示大小</label>
            <input type="range" id="logoScale" min="0.1" max="2.0" step="0.1" value="0.6">
        </div>
        <div class="control-group">
            <label for="audioSensitivity">音樂律動敏感度</label>
            <input type="range" id="audioSensitivity" min="0.5" max="5.0" step="0.1" value="1.6">
        </div>
        <div class="control-group">
            <label for="vectorFieldMode">粒子力學模式</label>
            <select id="vectorFieldMode" style="width: 100%; padding: 5px; background: #222; color: white; border: 1px solid #444;">
                <option value="0">平靜捲曲 (Curl Noise)</option>
                <option value="1">中心爆發 (Reverse Growth)</option>
                <option value="2">狂暴龍捲風 (Polar Fluid)</option>
                <option value="3">空間碎裂 (Topology Shatter)</option>
                <option value="4">螺旋星系 (Spiral Galaxy)</option>
                <option value="5">數位陣雨 (Digital Rain)</option>
                <option value="6">LOGO 形變 (Logo Morph)</option>
                <option value="7">飛灰消散 (Ash Disintegration)</option>
                <option value="8">螢火蟲群聚 (Firefly Swarm)</option>
                <option value="9">誓言心跳 (Vow Pulse)</option>
                <option value="10">星圖誓約 (Constellation Vows)</option>
                <option value="11">頭紗絲綢 (Veil Ribbons)</option>
                <option value="12">萬花筒祝福 (Mandala Bloom)</option>
                <option value="13">金粉禮炮 (Golden Finale)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="modeIntensity">模式強度</label>
            <input type="range" id="modeIntensity" min="0" max="2.5" step="0.05" value="0.8">
        </div>
        <div class="control-group">
            <label for="modeTurbulence">亂流細節</label>
            <input type="range" id="modeTurbulence" min="0" max="2.0" step="0.05" value="0.65">
        </div>
        <div class="control-group">
            <label for="returnForce">回聚力道</label>
            <input type="range" id="returnForce" min="0" max="2.0" step="0.05" value="0.9">
        </div>
        <div class="control-group">
            <label for="pointSize">粒子亮點大小</label>
            <input type="range" id="pointSize" min="0.2" max="2.5" step="0.05" value="0.8">
        </div>
        <button id="enable-webcam" style="width: 100%; padding: 10px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 10px;">啟用手勢追蹤 (Webcam)</button>
        <button id="enable-mic" style="width: 100%; padding: 10px; background: #e91e63; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 10px;">啟用麥克風 (音樂律動)</button>
        <button id="enable-fullscreen" style="width: 100%; padding: 10px; background: #4CAF50; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">進入全螢幕模式</button>
    </div>

    <script type="module" src="./main.js?v=20260616c"></script>
</body>
</html>
