<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #vj-console {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            pointer-events: auto;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        #webcam-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            z-index: 10;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; /* hidden by default, can be toggled */
        }
        #webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .hud-text {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="hud-text">
        <div>GPGPU PARTICLE SYSTEM</div>
        <div id="fps-counter">FPS: 0</div>
        <div id="particle-count">PARTICLES: 0</div>
    </div>

    <div id="webcam-container">
        <video id="webcam-video" autoplay playsinline></video>
    </div>

    <div id="vj-console">
        <div class="control-group">
            <label for="uProgress">Vector Field Progress (Pinch to control)</label>
            <input type="range" id="uProgress" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="control-group">
            <label for="cameraMode">Camera Mode</label>
            <select id="cameraMode" style="width: 100%; padding: 5px; background: #222; color: white; border: 1px solid #444;">
                <option value="auto">Auto Cinematic</option>
                <option value="manual">Manual (Orbit)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="uploadPhoto">Upload Custom Photo (JPG/PNG)</label>
            <input type="file" id="uploadPhoto" accept="image/*" style="width: 100%; color: white;">
        </div>
        <div class="control-group">
            <label for="particleDensity">Particle Density (1=High, 5=Low)</label>
            <input type="range" id="particleDensity" min="1" max="5" step="1" value="1">
        </div>
        <div class="control-group">
            <label for="audioSensitivity">Audio React Sensitivity</label>
            <input type="range" id="audioSensitivity" min="0.5" max="5.0" step="0.1" value="1.6">
        </div>
        <div class="control-group">
            <label for="vectorFieldMode">Vector Field Type</label>
            <select id="vectorFieldMode" style="width: 100%; padding: 5px; background: #222; color: white; border: 1px solid #444;">
                <option value="0">Curl Noise Disturbance</option>
                <option value="1">Reverse Growth</option>
                <option value="2">Polar Fluid</option>
                <option value="3">Topology Fragmentation</option>
            </select>
        </div>
        <button id="enable-webcam" style="width: 100%; padding: 10px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 10px;">Enable Hand Tracking</button>
        <button id="enable-mic" style="width: 100%; padding: 10px; background: #e91e63; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 10px;">Enable Microphone (Audio React)</button>
        <button id="enable-fullscreen" style="width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #666; font-weight: bold; cursor: pointer; border-radius: 4px;">Toggle Fullscreen</button>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
