<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding VFX Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #file-protocol-warning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            color: #fff;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        #file-protocol-warning .message {
            max-width: 560px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 8px;
            padding: 24px;
            background: rgba(20, 20, 20, 0.95);
            line-height: 1.7;
        }
        #file-protocol-warning a {
            color: #9fd0ff;
            font-weight: 700;
        }
        html.file-protocol #file-protocol-warning {
            display: flex;
        }
    </style>
    <script>
        if (window.location.protocol === 'file:') {
            document.documentElement.classList.add('file-protocol');
        }
    </script>
    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
</head>
<body>
    <div id="file-protocol-warning">
        <div class="message">
            <h1>請使用本機 HTTP 預覽</h1>
            <p>這個專案使用 ES modules、GLTF 與跨來源資源，直接開啟 <code>index.html</code> 會被瀏覽器 CORS 擋住。</p>
            <p>請先啟動本機伺服器，然後開啟 <a href="http://127.0.0.1:57832/?v=20260819_wedding_v9">http://127.0.0.1:57832/?v=20260819_wedding_v9</a></p>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="module" src="./main.js?v=20260819_wedding_v9"></script>
</body>
</html>
